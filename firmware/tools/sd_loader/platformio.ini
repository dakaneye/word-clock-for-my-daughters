; firmware/tools/sd_loader/platformio.ini
; Standalone loader project — see
; docs/superpowers/specs/2026-07-13-sd-loader-design.md.
; Platform pin + build_unflags are load-bearing (CLAUDE.md): 6.8.0 exact,
; and Arduino-ESP32 appends -std=gnu++11 after ours without the unflag.
[env:sdloader]
platform = espressif32@6.8.0
framework = arduino
board = esp32dev
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I ../../configs
